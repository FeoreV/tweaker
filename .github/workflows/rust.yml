name: Rust host checks

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install verified Rust toolchain
        run: rustup toolchain install 1.97.1-x86_64-pc-windows-msvc --profile minimal --component rustfmt --component clippy
      - name: Check
        run: cargo +1.97.1-x86_64-pc-windows-msvc check --locked
      - name: Check experimental UI feature
        run: cargo +1.97.1-x86_64-pc-windows-msvc check --locked --features experimental-ui
      - name: Test
        run: cargo +1.97.1-x86_64-pc-windows-msvc test --locked
      - name: Test experimental UI host
        run: cargo +1.97.1-x86_64-pc-windows-msvc test --locked --features experimental-ui
      - name: Format
        run: cargo +1.97.1-x86_64-pc-windows-msvc fmt --all -- --check
      - name: Clippy
        run: cargo +1.97.1-x86_64-pc-windows-msvc clippy --locked --all-targets -- -D warnings
      - name: Clippy experimental UI feature
        run: cargo +1.97.1-x86_64-pc-windows-msvc clippy --locked --all-targets --features experimental-ui -- -D warnings
