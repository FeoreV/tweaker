[package]
name = "sciter-rs"
version = "0.5.58"
edition = "2015"
license = "MIT"
repository = "https://github.com/sciter-sdk/rust-sciter"

[lib]
name = "sciter"
path = "src/lib.rs"

[features]
default = ["dynamic"]
dynamic = []
extension = []
nightly = []
windowless = []

[dependencies]
libc = "0.2"
lazy_static = "1.0"

[target.'cfg(target_vendor = "apple")'.dependencies]
objc = "0.2"
objc-foundation = "0.1"
