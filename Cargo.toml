[package]
name = "rustweaker"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target."cfg(windows)".dependencies]
sciter-rs = { version = "0.5.58", optional = true }
windows-sys = { version = "0.59.0", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_SystemServices", "Win32_System_WindowsProgramming", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Kernel", "Win32_System_Registry", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_Storage_FileSystem", "Win32_Networking_WinSock", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Wdk_System_SystemServices"] }

[features]
experimental-ui = ["dep:sciter-rs"]

[patch.crates-io]
sciter-rs = { path = "vendor/sciter-rs" }
